services:
  - type: web
    name: pdf-to-word
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 50
    healthCheckPath: /
